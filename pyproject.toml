[project]
name = "hyusk"
version = "0.5.0"
description = "Hyusk: a cross-platform computer agent."
readme = "README.md"
authors = [
    { name = "devbulchandani", email = "devbulchandani@users.noreply.github.com" }
]
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agent", "cli", "automation", "computer-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# All-in-one install for voice I/O.
voice = [
    "sounddevice>=0.4",
    "numpy>=1.20",
    "scipy>=1.10",
]
# Local TTS: Kokoro (recommended, cross-platform) + macOS `say` zero-dep
tts = [
    "kokoro-onnx>=0.6",
    "soundfile>=0.12",
]
# Local STT: whisper.cpp via pywhispercpp
stt = [
    "pywhispercpp>=1.4",
]
# Cloud TTS/STT (optional, requires API key)
tts-cloud = [
    "httpx>=0.27",
]
# Everything for local voice (TTS + STT + audio I/O)
mic = [
    "hyusk[voice,tts,stt]",
]
all = [
    "hyusk[voice,tts,stt,tts-cloud]",
]

[project.scripts]
hyusk = "hyusk.cli.app:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hyusk"
module-root = "src"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
